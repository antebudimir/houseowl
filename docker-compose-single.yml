version: "3"
services:
  back:
    image: antebudimir/houseowl:latest
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      - JWT_SECRET_KEY=PLEASE_CHANGE_ME
      # - KITCHENOWL_MCP_ENABLED=true # Optional: enable MCP endpoint at /mcp
      # - FRONT_URL=http://localhost # Optional take a look at https://docs.kitchenowl.org/self-hosting/advanced/ for more info
    volumes:
      - houseowl_data:/data

volumes:
  houseowl_data:
