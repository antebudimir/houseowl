# This fork publishes a single combined image (backend serves the web app on
# port 8080). The separate front/back split from upstream is not available.
services:
  houseowl:
    image: ghcr.io/antebudimir/houseowl:latest
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      - JWT_SECRET_KEY=PLEASE_CHANGE_ME
      # - HOUSEOWL_MCP_ENABLED=true # Optional: enable MCP endpoint at /mcp
      # - FRONT_URL=http://localhost # Optional take a look at https://docs.kitchenowl.org/latest/self-hosting/advanced/ for more info
    volumes:
      - houseowl_data:/data

volumes:
  houseowl_data:
