services:
  front:
    image: antebudimir/houseowl-web:latest
    restart: unless-stopped
    # environment:
    #   - BACK_URL=back:5000 # Change this if you rename the containers
    ports:
      - "80:80"
    depends_on:
      - back
  back:
    image: antebudimir/houseowl-backend:latest
    restart: unless-stopped
    environment:
      - JWT_SECRET_KEY=PLEASE_CHANGE_ME
      # - HOUSEOWL_MCP_ENABLED=true # Optional: enable MCP endpoint at /mcp
      # - FRONT_URL=http://localhost # Optional take a look at https://docs.kitchenowl.org/latest/self-hosting/advanced/ for more info
    volumes:
      - houseowl_data:/data

volumes:
  houseowl_data:
