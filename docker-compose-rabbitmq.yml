version: "3"
# NOTE: not usable with this fork's published image. This fork ships a single
# combined container (web + backend on port 8080); the separate
# front/back/celery split that rabbitmq mode requires is not published.
# Kept for reference only — see docker-compose.yml instead.
services:
# rabbitmq is only supported with a separate front & backend container
  front:
    image: antebudimir/houseowl-web:latest
    restart: unless-stopped
    # environment:
    #   - BACK_URL=back:5000 # Change this if you rename the containers
    ports:
      - "80:80"
    depends_on:
      - back
  back:
    image: antebudimir/houseowl-backend:latest
    restart: unless-stopped
    command: --ini wsgi.ini:celery --gevent 100
    environment:
      - JWT_SECRET_KEY=PLEASE_CHANGE_ME
      - MESSAGE_BROKER="amqp://rabbitmq"
    volumes:
      - houseowl_data:/data
  rabbitmq:
    image: rabbitmq:3
    volumes:
        - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq/

volumes:
  houseowl_data:
