name: Build Android APK

# Build signed release APKs, uploaded as a workflow artifact.
# Mirrors the Android job of release.yml without drafting a GitHub release.
# Runs automatically when app code changes; backend-only pushes skip it
# since APK builds burn Actions minutes.
#
# Artifacts are private even on a public repository, so a link other people
# can open needs a release asset. Dispatch with `release_tag` set to attach
# the APKs to that release (created if it does not exist yet).

on:
  push:
    branches:
      - main
    paths:
      - 'kitchenowl/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach the APKs to (created if missing). Leave empty to upload the artifact only.'
        required: false
        type: string

# Artifacts have no immutable tag — a rapid second push would otherwise
# queue an overlapping build and the older run's APK could be mistaken
# for the newest. Cancel superseded runs; dispatch manually for a
# specific commit's APK.
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Build release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Configure Flutter
        run: flutter config --no-analytics

      - name: Get packages
        run: flutter packages get
        working-directory: kitchenowl

      - name: Configure Keystore for Android
        run: |
          echo "$PLAY_STORE_UPLOAD_KEY" | base64 --decode > app/upload-keystore.jks
          echo "storeFile=upload-keystore.jks" >> key.properties
          echo "keyAlias=$KEYSTORE_KEY_ALIAS" >> key.properties
          echo "keyPassword=$KEYSTORE_KEY_PASSWORD" >> key.properties
          echo "storePassword=$KEYSTORE_STORE_PASSWORD" >> key.properties
        env:
          PLAY_STORE_UPLOAD_KEY: ${{ secrets.PLAY_STORE_UPLOAD_KEY }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        working-directory: kitchenowl/android

      - name: Build APKs
        run: flutter build apk --release --split-per-abi
        working-directory: kitchenowl

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: houseowl-android
          path: kitchenowl/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

  publish:
    name: Attach APKs to release
    needs: apk
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: houseowl-android
          path: apk

      - name: Name APKs after the release and ABI
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p out
          for file in apk/*.apk; do
            abi=$(basename "$file" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$file" "out/HouseOwl-${TAG}-${abi}.apk"
          done
          ls -l out

      - name: Publish to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
          else
            gh release create "$TAG" out/*.apk \
              --target "$GITHUB_SHA" \
              --title "HouseOwl $TAG" \
              --notes "Android APKs built from $GITHUB_SHA."
          fi
