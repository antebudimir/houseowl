name: CI deploy backend (podman)

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for tags
  push:
    branches: [ main ]
    paths:
      - backend/**
    tags:
      - "v*"
      - "beta-v*"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: decide docker tags
        id: dockertag
        run: |
          if [[ $REF == "refs/tags/v"* ]]
          then
            echo "tags=$BASE_TAG:latest, $BASE_TAG:beta, $BASE_TAG:${REF#refs/tags/}" >> $GITHUB_ENV
          elif [[ $REF == "refs/tags/beta-v"* ]]
          then
            echo "tags=$BASE_TAG:beta, $BASE_TAG:${REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "tags=$BASE_TAG:dev" >> $GITHUB_ENV
          fi
        env:
          REF: ${{ github.ref }}
          BASE_TAG: ${{ secrets.DOCKER_HUB_USERNAME }}/houseowl-backend

      - name: Set up QEMU (binfmt for cross-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Login to Docker Hub (podman)
        run: |
          echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | podman login docker.io \
            --username ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build and push
        id: podman_build
        run: |
          set -euo pipefail
          TAG_LIST=$(echo "$TAGS" | tr ',' '\n' | xargs)
          MANIFEST="docker.io/$(echo "$TAG_LIST" | awk '{print $1}')"
          podman manifest create "$MANIFEST"
          podman build \
            --platform linux/amd64,linux/arm64 \
            --manifest "$MANIFEST" \
            ./backend -f backend/Dockerfile
          for tag in $TAG_LIST; do
            podman manifest push "$MANIFEST" "docker.io/$tag"
          done
        env:
          TAGS: ${{ env.tags }}

      - name: Image digest
        run: echo "Pushed manifest list; digests printed above by podman manifest push"
