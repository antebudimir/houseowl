version: "3"
services:
  db:
    image: postgres:15
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped
    environment:
      POSTGRES_DB: houseowl
      POSTGRES_USER: houseowl
      POSTGRES_PASSWORD: example
    volumes:
      - houseowl_db:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
  back:
    image: antebudimir/houseowl:latest
    restart: unless-stopped
    ports:
      - "80:8080"
    networks:
      - default
    environment:
      JWT_SECRET_KEY: PLEASE_CHANGE_ME
      DB_DRIVER: postgresql
      DB_HOST: db
      DB_NAME: houseowl
      DB_USER: houseowl
      DB_PASSWORD: example
    depends_on:
      - db
    volumes:
      - houseowl_files:/data

volumes:
  houseowl_files:
    driver: local
  houseowl_db:
    driver: local

networks:
  default:
