org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
android.enableJetifier=true
android.enableR8.fullMode=false

# Pin mobile_scanner to the bundled (in-app) ML Kit barcode model — no model
# download via Google Play Services at scan time. Explicit so a future
# mobile_scanner version flipping its default can not silently switch us to
# the Play-Services variant. (mobile_scanner reads this via findProperty in
# its android/build.gradle.kts.)
dev.steenbakker.mobile_scanner.useUnbundled=false